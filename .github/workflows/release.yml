name: Release Creation

on:
  push:
    tags:
      - 'v*' # Löst aus, wenn ein Tag wie v1.0.0 gepusht wird

jobs:
  build:
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, 'beta') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Version Prefix (14.x.x)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' module.json)"
          if [[ ! "$version" =~ ^14\. ]]; then
            echo "module.json version must start with 14.x.x, got: $version"
            exit 1
          fi
          # The tag and module.json have to agree, or Foundry offers an update
          # whose manifest still names the old version.
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create Module Archive
        run: zip -r ./module.zip . -x ".git/*" ".github/*" "README.md" "CHANGELOG.md" "AGENTS.md" "*.code-workspace"

      # The release text is the changelog section of this version, as in every
      # Ninjo module. Until 14.2610.1 the release page stayed empty.
      - name: Release Notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python .github/scripts/release_notes.py

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            module.json
            module.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} (FVTT 13-14)
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Module to FoundryVTT Website
        uses: cs96and/FoundryVTT-release-package@v1
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
          manifest-url: https://github.com/Niclasp1501/Ninjos-Player-Wheel/releases/download/${{ github.ref_name }}/module.json
